<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>点位与图像对比</title>
  <link rel="stylesheet" href="comparison.css">
</head>
<body>
  <header><div><span class="eyebrow">点位核对</span><h1>看看哪些位置发生了变化</h1></div><span class="readonly">只读对比 · 不修改点位</span></header>
  <nav aria-label="图像对比工具">
    <label>来源 <select id="source"><option value="surface">地表</option><option value="borehole">地下（仅 KiK-net）</option></select></label>
    <button id="refresh" class="primary">获取最新图片</button><button id="load">打开本地图片</button><button id="snapshot">同步编辑器点位</button>
    <label><input type="checkbox" id="suspended">包含停用站点</label>
    <label>已知范围 <select id="footprint"><option value="1">3×3 像素</option><option value="0">仅取色像素</option></select></label>
  </nav>
  <div class="meta"><span id="file">尚未同步点位</span><span id="stamp">尚未获取图片</span></div>
  <div id="notice" role="status">正在连接编辑器…</div>
  <section class="summary" aria-label="像素统计">
    <div><i class="missing"></i><span>缺失像素</span><strong id="missing">—</strong></div>
    <div><i class="added"></i><span>新增像素</span><strong id="added">—</strong></div>
    <div><i class="matched"></i><span>重合像素</span><strong id="matched">—</strong></div>
    <div><span>参与对比站点</span><strong id="stations">—</strong></div>
  </section>
  <div class="view-tools"><span>三图同步缩放、平移 · 拖动地图 / 滚轮缩放</span><label>倍率 <select id="zoom"><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option><option value="5">5×</option><option value="10">10×</option></select></label><button id="reset">重置视图</button><span id="pixel">原图坐标：—</span></div>
  <section class="point-details" aria-label="选中点位信息">
    <div><strong id="point-title">未选择点位</strong><p id="point-info">点击左侧已知点位查看信息；点击空白或清除选择后可传递当前视图。</p><div id="point-candidates" aria-label="附近或重叠点位"></div></div>
    <div class="point-actions"><button id="clear-selection" disabled>清除选择</button><button id="send-main" class="primary">将当前视图传到主窗口</button></div>
  </section>
  <main>
    <section class="panel"><h2>01 <span>已知点位</span></h2><canvas id="known" aria-label="已知点位图"></canvas></section>
    <section class="panel"><h2>02 <span>监测原图</span></h2><canvas id="latest" aria-label="最新监测图像"></canvas></section>
    <section class="panel"><h2>03 <span>差异叠加</span></h2><canvas id="difference" aria-label="红色缺失、青色新增、灰色重合"></canvas></section>
  </main>
  <p class="explanation">按彩色监测像素的位置比较，震度颜色变化不计为新增或缺失。3×3 范围以正式取色坐标为中心；人工偏移、重叠、停用及临时缺测也可能产生差异，不等同于站点增撤。草稿和未标注点不参与。</p>
  <section class="issues"><div><h2>取色位置缺测 <span id="missing-count"></span></h2><div id="missing-list" class="issue-list"></div></div><div><h2>新增像素区域 <span id="added-count"></span></h2><div id="added-list" class="issue-list"></div></div></section>
  <script src="image-comparison.js"></script><script src="comparison.js"></script>
</body>
</html>
